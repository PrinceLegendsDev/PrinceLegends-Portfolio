<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Fira+Code&display=swap"
        rel="stylesheet"
    >

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <title>Tech Legends | Full Stack Developer</title>
</head>

<body>

    <header id="header"></header>

    <main>

        <section class="hero" aria-labelledby="hero-title">

            <div class="container hero-cont">

                <div class="hero-image">
                    <img
                        src="assets/logo.jpg"
                        alt="Prince Mutale - Tech Legends"
                    >
                </div>

                <div class="hero-text">

                    <p class="hero-greeting">
                        Hello, I'm
                    </p>

                    <h1 id="hero-title" class="hero-title">
                        Prince Mutale
                    </h1>

                    <h2 class="hero-role">
                        Full Stack Developer
                    </h2>

                    <p class="hero-tagline">
                        Building practical digital solutions for businesses.
                    </p>

                    <p class="hero-description">
                        I build responsive web applications and practical
                        business software using modern web technologies.
                        I'm focused on turning real business problems into
                        simple, useful digital solutions.
                    </p>

                    <div class="hero-buttons">
                        <a href="contact.html" class="btn">
                            Hire Me
                        </a>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer id="footer"></footer>

    <script type="module" src="js/main.js"></script>

</body>
</html>
