<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
     <link rel="stylesheet" href="css/style.css">
    <title>Legends Portifolio</title>
</head>
<body>
    
    <header id="header"></header>


    <main>
        
        <section class="skills-section">

            <div class="container skills-cont">

                <div class="section-header">

                    <h2 class=skill-tag>My skills & Expertise</h2>

                    <p class="skill-des">I combine creative And Technology To Build Morden Digital Experinces</p>

                </div>

                <div class="skill-card">

                    <div class="card-header">

                        <i class="fa-solid fa-code"></i>

                        <h3>Web Development</h3>

                    </div>

                    <div class="skill-item">

                        <div class="skill-info">

                            <span>HTML5</span>
                             <span>90%</span>

                        </div>

                        <div class="progress-bar">

                            <div class="progress html"></div>

                        </div>


                    </div>

                    <div class="skill-item">

                        <div class="skill-info">

                            <span>CSS3</span>
                            <span>85%</span>

                        </div>

                        <div class="progress-bar">

                            <div class="progress css"></div>

                        </div>

                    </div>

                    <div class="skill-item">

                        <div class="skill-info">

                            <span>JavaScript</span>
                            <span>75%</span>

                        </div>

                        <div class="progress-bar">

                            <div class="progress javascript"></div>

                        </div>

                    </div>


                </div>


                 <!-- Graphic Design Card -->

                 <div class="skill-card">

                    <div class="card-header">

                        <i class="fa-solid fa-palette"></i>

                        <h3>Graphic Design</h3>

                    </div>

                    <div class="skill-item">

                        <div class="skill-info">

                            <span>Photo Shop</span>
                            <span>80%</span>

                        </div>

                        <div class="progress-bar">

                            <div class="progress photoshop"></div>

                        </div>

                        <div class="skill-item">

                            <div class="skill-info">

                                <span>IIIustrator</span>
                                <span>75%</span>

                            </div>

                            <div class="progress-bar">

                                <div class="progress IIIustrator"></div>

                            </div>

                        </div>

                    </div>

                 </div>
            </div>

        </section>


    </main>

    
    <footer id="footer"></footer>






    <script type="module" src="js/main.js"></script>
</body>
</html>
